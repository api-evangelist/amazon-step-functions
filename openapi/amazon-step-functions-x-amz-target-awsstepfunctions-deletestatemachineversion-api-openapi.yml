            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArn'
              examples:
                DeleteStateMachineVersion481Example:
                  summary: Default DeleteStateMachineVersion 481
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
              examples:
                DeleteStateMachineVersion482Example:
                  summary: Default DeleteStateMachineVersion 482
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStateMachineVersionInput'
            examples:
              DeleteStateMachineVersionRequestExample:
                summary: Default DeleteStateMachineVersion request
                x-microcks-default: true
                value:
                  stateMachineVersionArn: arn:aws:service:us-east-1:123456789012:resource/example
      parameters:
      - name: X-Amz-Target
